schema_version: "1.0"
corpus_id: nucc-ops-v1
fiction_notice: All listed organizations, sites, employees, events, and operational content are fictional educational test material.
brand:
  config_path: corpus/brand.yml
  status: proposed
visuals:
  - id: nucc-logo
    target_document_id: shared
    kind: logo
    category: decorative
    purpose: Provide a recognizable fictional organization identity and compact letterhead mark.
    placement: Small header/title-area mark across PDFs; omit if it competes with quick-reference content.
    caption: ""
    alt_text: "Proposed Northstar Urgent Care Cooperative mark: a north-star motif with three rounded points for its fictional sites."
    asset_path: assets/generated/nucc-logo.svg
    sources: []
    generation:
      approach: Deterministic local SVG generated from the brand palette and concept; preserve editable source and canonical output.
      input: corpus/brand.yml:visual_identity.logo
      seed: null
      tool: scripts/generate_visuals.py
      tool_version: "0.1.0; Python 3.14.7; PyYAML 6.0.3"
      prompt_or_config: No medical cross, caduceus, real-world mark, or claim of accreditation.
      preserve_output: true
    review_notes: ["Generated from the proposed fictional brand concept; visual review pending.", "Visual checked against cited source/brand facts; PDF layout and extracted text checked."]
    status: reviewed
  - id: letterhead
    target_document_id: shared
    kind: letterhead
    category: decorative
    purpose: Visually identify the fictional publisher while keeping reader-relevant metadata in text.
    placement: Reusable header component in renderer, with document-specific title and metadata beneath it.
    caption: ""
    alt_text: Northstar Urgent Care Cooperative fictional letterhead with document identity and status shown as selectable text.
    asset_path: null
    sources: []
    generation:
      approach: HTML/CSS print component using local logo SVG and brand.yml colors; no document content baked into an image.
      input: corpus/brand.yml
      seed: null
      tool: HTML/CSS renderer
      tool_version: null
      prompt_or_config: Keep title, ID, status, scope, and dates as PDF text; vary page families by document type.
      preserve_output: true
    review_notes: ["Renderer implementation pending."]
    status: proposed

  - id: opening-closing-check-flow
    target_document_id: NU-OPS-002
    kind: diagram
    category: evidence_bearing
    purpose: Show the checklist handoff sequence and distinguish routine steps from the Harbor Point-only exception reference.
    placement: After the opening/closing workflow overview, before detailed checklist steps.
    caption: Proposed opening decision flow distinguishes a routine handoff with a follow-up from a blocking condition that is held and routed; the closing record and Harbor Point exception are shown separately.
    alt_text: "Draft flow branches on whether routine opening handoff can proceed. A handoff may proceed with a proposed Complete with open item outcome; a blocking condition uses the proposed Hold for site lead outcome and routes the facilities issue through NU-OPS-007. A separate closing record lists site, time, follow-up, and next owner; Harbor Point after-hours access remains conditional on NU-OPS-004 and both documents being approved/effective."
    asset_path: assets/generated/opening-closing-check-flow.svg
    sources:
      - document_id: NU-OPS-002
        locator: {kind: section, value: "Before opening; Opening handoff and readiness record; During-day issue logging; Closing handoff; After-hours access boundary"}
        claim_supported: Routine handoff includes checks, issue logging, site-lead coordination, and closeout; after-hours access is separately governed.
      - document_id: NU-OPS-004
        locator: {kind: document_metadata, value: "site_scope, effective_date, expiration_date; exception scope"}
        claim_supported: The exception applies only at Harbor Point for its stated administrative-storage work and proposed date window.
    generation:
      approach: Deterministic SVG flow generated from a declarative step/exception-note YAML file and checked against cited sections.
      input: corpus/data/visuals/opening-flow.yml
      seed: null
      tool: scripts/generate_visuals.py
      tool_version: "0.1.0; Python 3.14.7; PyYAML 6.0.3"
      prompt_or_config: Do not add an emergency, clinical, or unlisted alternate route; visually label all details as draft/proposed.
      preserve_output: true
    review_notes: ["Do not draw approval as complete while source remains draft.", "Visual checked against cited source/brand facts; PDF layout and extracted text checked."]
    status: reviewed
  - id: facilities-routing-flow
    target_document_id: NU-OPS-003
    kind: diagram
    category: evidence_bearing
    purpose: Make intake ownership, priority routing, and follow-up easier to scan.
    placement: Beside or immediately before the priority-to-routing section.
    caption: Proposed facilities intake and escalation path; use the source's priority categories and role routes exactly.
    alt_text: Facilities workflow from observed issue to intake record, priority classification, role-based routing, status update, and owner-confirmed closure.
    asset_path: null
    sources:
      - document_id: NU-OPS-003
        locator: {kind: section, value: "Intake fields and issue record; Priority definitions; Routine routing path; Urgent site coordination; Status updates and closure"}
        claim_supported: Intake, priority, routing, and closure stages and their described ownership.
      - document_id: NU-OPS-007
        locator: {kind: section, value: "Facilities issue routing; After-hours path"}
        claim_supported: Only named fictional role-based destinations and the documented after-hours route may appear.
    generation:
      approach: Hand-authored SVG from a declarative flow specification checked against both procedures.
      input: corpus/data/visuals/facilities-routing.yml (to be created only after source approval)
      seed: null
      tool: Python standard library SVG emitter
      tool_version: null
      prompt_or_config: Historical NU-OPS-016 route must not appear as current; no new response-time guarantee.
      preserve_output: true
    review_notes: ["Cross-check every destination against current draft and mark unapproved workflow as proposed."]
    status: proposed

  - id: access-scope-bands
    target_document_id: NU-OPS-010
    kind: diagram
    category: evidence_bearing
    purpose: Explain the three exact access-scope labels and the rule that scope inheritance is not implied.
    placement: After the scope definitions and before the employee-ID eligibility table.
    caption: Fictional corpus access labels; the matrix remains authoritative for the exact employee IDs.
    alt_text: Three separate access bands— all_staff, site_operations, operations_leads—with no implied inheritance; an adjacent text table lists exact employee eligibility.
    asset_path: null
    sources:
      - document_id: NU-OPS-010
        locator: {kind: section, value: "Scope labels; Employee eligibility by scope; No inheritance"}
        claim_supported: Exact scope labels, employee membership, and absence of automatic inheritance.
    generation:
      approach: SVG labels and nested-free bands; include adjacent selectable-text table rather than encoding IDs only in the image.
      input: corpus/documents/markdown/NU-OPS-010-information-access-matrix.md front matter and employee eligibility table
      seed: null
      tool: Python standard library SVG emitter
      tool_version: null
      prompt_or_config: Preserve exact capitalization/identifiers and do not imply a hierarchy or inheritance.
      preserve_output: true
    review_notes: ["The graphic is explanatory only; the exact list remains text."]
    status: proposed

  - id: weather-status-card-art
    target_document_id: NU-OPS-013
    kind: illustration
    category: decorative
    purpose: Add a friendly visual cue to the quick-reference card without forecasting weather or depicting a real site condition.
    placement: Small title-area illustration; status fields stay prominent.
    caption: ""
    alt_text: Simple umbrella-and-cloud illustration used as a decorative cue for the severe-weather coordination card.
    asset_path: null
    sources: []
    generation:
      approach: Hand-drawn local SVG icon with no forecast, hazard level, or site-specific weather depiction.
      input: corpus/brand.yml visual palette
      seed: null
      tool: SVG
      tool_version: null
      prompt_or_config: Decorative only; no safety instruction encoded in the icon.
      preserve_output: true
    review_notes: ["Must not suggest a real forecast or safety assessment."]
    status: proposed

  - id: weather-update-steps
    target_document_id: NU-OPS-013
    kind: diagram
    category: evidence_bearing
    purpose: Visually organize the status-update sequence and separate unknown status from confirmed status.
    placement: Below Coordination steps.
    caption: Proposed administrative update sequence; unknowns stay marked unconfirmed.
    alt_text: Site status is recorded with its basis and last-confirmed time, routed to central operations, shared through locally approved channel, then updated on material change or shift handoff; unknown owners remain unconfirmed.
    asset_path: null
    sources:
      - document_id: NU-OPS-013
        locator: {kind: section, value: "Coordination steps; Site status update fields; Central and role-based routes"}
        claim_supported: The stated status fields, notification sequence, material-change/handoff triggers, and no-substitute rule.
      - document_id: NU-OPS-007
        locator: {kind: section, value: "Role-based central routes"}
        claim_supported: Role destinations used for site and central coordination.
    generation:
      approach: Compact SVG sequence with an explicit “unconfirmed” state and no timed SLA.
      input: corpus/data/visuals/weather-update-flow.yml (to be created only after source approval)
      seed: null
      tool: Python standard library SVG emitter
      tool_version: null
      prompt_or_config: No forecast icons connected to site status; no inferred deputy or reopening route.
      preserve_output: true
    review_notes: ["Procedure details remain proposed in the draft source."]
    status: proposed

  - id: historical-copy-stamp
    target_document_id: NU-OPS-016
    kind: callout
    category: evidence_bearing
    purpose: Make historical/superseded status visible without visually presenting the old route as current.
    placement: Prominent text banner below the title; repeat status as text in header metadata.
    caption: Historical copy — superseded by NU-OPS-003 for the stated facilities-routing scope.
    alt_text: Text callout stating NU-OPS-016 is a historical draft planned as superseded by NU-OPS-003; it is not current routing guidance.
    asset_path: null
    sources:
      - document_id: NU-OPS-016
        locator: {kind: document_metadata, value: "planned_status; relationships"}
        claim_supported: NU-OPS-016 is planned as superseded and points to NU-OPS-003.
      - document_id: NU-OPS-003
        locator: {kind: document_metadata, value: "relationships: supersedes NU-OPS-016"}
        claim_supported: NU-OPS-003 is the proposed successor for facilities issue intake and routing.
    generation:
      approach: Renderer text callout, not an image-only stamp; preserve status as searchable PDF text.
      input: Markdown front matter relationships and planned_status
      seed: null
      tool: HTML/CSS renderer
      tool_version: null
      prompt_or_config: Do not imply approval; source documents are currently drafts.
      preserve_output: true
    review_notes: ["Use “planned as superseded” or equivalent while source approvals are pending."]
    status: proposed

  - id: schedule-version-timeline
    target_document_id: NU-OPS-017
    kind: timeline
    category: evidence_bearing
    purpose: Clarify historical-to-proposed notice sequence and avoid applying the prior rule to current dates.
    placement: Near revision/history note.
    caption: Proposed schedule-notice chronology; approval and effective-state labels follow the source documents.
    alt_text: Timeline from prior notice NU-OPS-017 effective 2024-01-01 to proposed replacement NU-OPS-005 effective 2024-09-21, with draft/approval status noted.
    asset_path: null
    sources:
      - document_id: NU-OPS-017
        locator: {kind: document_metadata, value: "issued_date; effective_date; planned_status; relationships"}
        claim_supported: Prior notice issue/effective dates and proposed superseded relationship.
      - document_id: NU-OPS-005
        locator: {kind: document_metadata, value: "issued_date; effective_date; planned_status; relationships"}
        claim_supported: Replacement notice proposed issue/effective dates and supersession of NU-OPS-017.
    generation:
      approach: Lightweight SVG timeline generated from cited YAML date inputs or parsed front matter; label proposals explicitly.
      input: Document metadata in NU-OPS-005 and NU-OPS-017 front matter
      seed: null
      tool: Python standard library SVG emitter
      tool_version: null
      prompt_or_config: Dates are proposed until approved; do not present the line as evidence of authorization.
      preserve_output: true
    review_notes: ["Confirm chronology against fact ledger before approval."]
    status: proposed

  - id: huddle-followup-status
    target_document_id: NU-OPS-012
    kind: illustration
    category: evidence_bearing
    purpose: Help readers scan completed, open, deferred, and unresolved items without changing their status.
    placement: Small status legend before action tables; preserve the detailed text entries.
    caption: Huddle status legend; each item’s detailed record remains authoritative.
    alt_text: "Four labeled status chips: completed during huddle, open follow-up, deferred item, unresolved question."
    asset_path: null
    sources:
      - document_id: NU-OPS-012
        locator: {kind: section, value: "Completed during this huddle; Open follow-ups; Deferred items; Unresolved service-desk question"}
        claim_supported: The four distinctions and item classifications used in the notes.
    generation:
      approach: HTML/CSS text chips with icons redundant to labels; all labels selectable text.
      input: Headings and item statuses in NU-OPS-012
      seed: null
      tool: HTML/CSS renderer
      tool_version: null
      prompt_or_config: Do not show the Alder Creek backup as resolved or September metrics as reported.
      preserve_output: true
    review_notes: ["Do not encode color alone as meaning."]
    status: proposed

  - id: operations-metrics-no-results-warning
    target_document_id: NU-OPS-019
    kind: callout
    category: evidence_bearing
    purpose: Prevent readers from mistaking definitions for measured results.
    placement: Near the top, before measure definitions.
    caption: Definitions only; no source records or monthly totals are included.
    alt_text: Text callout stating this document defines measures but contains no values, dataset, denominator, or targets.
    asset_path: null
    sources:
      - document_id: NU-OPS-019
        locator: {kind: section, value: "Purpose and reporting period; Known data limits"}
        claim_supported: The document supplies definitions only and no numerical totals/source dataset.
      - document_id: NU-OPS-012
        locator: {kind: section, value: "Completed during this huddle; Deferred items"}
        claim_supported: The huddle reports no metric values and defers targets/comparisons.
    generation:
      approach: Searchable text callout with a simple local icon; no chart generated because there are no results data.
      input: Source statements in NU-OPS-019 and NU-OPS-012
      seed: null
      tool: HTML/CSS renderer
      tool_version: null
      prompt_or_config: No invented values, bars, trend lines, targets, denominators, or site comparisons.
      preserve_output: true
    review_notes: ["Explicitly defer a results chart until an approved structured dataset exists."]
    status: proposed

