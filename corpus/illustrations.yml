  - id: staff-site-role-map
    target_document_id: NU-OPS-021
    kind: diagram
    category: evidence_bearing
    purpose: Show the three fictional sites and the role-based site-lead entries recorded in the directory.
    placement: Directory section grouping staff by site.
    caption: Registry-listed home sites and site-lead roles; a role-only route is not a named employee assignment.
    alt_text: Three-site schematic with Harbor Point linked to EMP-003, Northgate linked to EMP-008, and Alder Creek labeled role-only/no named employee in staff.yml.
    asset_path: null
    sources:
      - source_path: corpus/staff.yml
        locator: {kind: field, value: "people[].employee_id, name, role, home_site"}
