<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">Routine opening and closing handoff</title>
  <desc id="desc">Current opening handoff with a decision branch: the routine handoff can proceed with an open item, or a blocking condition is held and routed. The closing record is shown separately. NU-OPS-004 is approved but scheduled for its stated Harbor Point window.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#FFFDF8"/>
  <text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#18324B">Routine opening and closing handoff</text>
  <rect x="40" y="68" width="300" height="30" rx="15" fill="#E8F3EA"/>
  <text x="55" y="89" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#3E6748">CURRENT · EFFECTIVE 2024-09-21</text>
  <rect x="40" y="168" width="285" height="166" rx="16" fill="#E8F2F4" stroke="#2D8C8C" stroke-width="2"/>
  <text x="56" y="196" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18324B">Opening handoff</text>
  <text x="56" y="222" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Record date, site, scheduled</text>
  <text x="56" y="241" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">handoff time, and completing role.</text>
  <text x="56" y="260" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Complete listed non-clinical</text>
  <text x="56" y="279" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">workspace and access-item checks.</text>
  <rect x="590" y="156" width="292" height="160" rx="16" fill="#E8F3EA" stroke="#2D8C8C" stroke-width="2"/>
  <text x="606" y="184" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18324B">Yes · routine handoff proceeds</text>
  <text x="606" y="210" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Record outcome: Complete or</text>
  <text x="606" y="229" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Complete with open item.</text>
  <text x="606" y="248" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">An open follow-up may remain</text>
  <text x="606" y="267" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">without holding routine handoff.</text>
  <rect x="590" y="350" width="392" height="150" rx="16" fill="#FFF1E9" stroke="#2D8C8C" stroke-width="2"/>
  <text x="606" y="378" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18324B">No · hold and route</text>
  <text x="606" y="404" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Use Hold for site lead outcome.</text>
  <text x="606" y="423" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Notify the local site lead.</text>
  <text x="606" y="442" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Route facilities issues through NU-OPS-007 and</text>
  <text x="606" y="461" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">the applicable facilities procedure.</text>
  <rect x="1010" y="168" width="250" height="270" rx="16" fill="#F5F0DE" stroke="#2D8C8C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1026" y="196" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18324B">At closing · separate record</text>
  <text x="1026" y="222" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Record site and handoff</text>
  <text x="1026" y="241" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">time.</text>
  <text x="1026" y="260" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Return shared access items</text>
  <text x="1026" y="279" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">to their designated</text>
  <text x="1026" y="298" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">location.</text>
  <text x="1026" y="317" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Record conditions needing</text>
  <text x="1026" y="336" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">follow-up.</text>
  <text x="1026" y="355" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">Name the receiving role, or</text>
  <text x="1026" y="374" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">mark the next owner</text>
  <text x="1026" y="393" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#263238">unconfirmed.</text>
  <path d="M325 250 L365 250" stroke="#18324B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <polygon points="450,166 534,250 450,334 366,250" fill="#FFFDF8" stroke="#18324B" stroke-width="3"/>
  <path d="M534 250 L590 235" stroke="#5C8968" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="541" y="226" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#52636B">YES</text>
  <path d="M450 334 L450 425 L590 425" stroke="#C26248" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="463" y="365" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#52636B">NO</text>
  <text x="1010" y="460" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#52636B">SEPARATE CLOSING RECORD</text>
  <text x="450" y="242" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#18324B" text-anchor="middle">Routine handoff can</text>
  <text x="450" y="263" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#18324B" text-anchor="middle">proceed?</text>
  <rect x="40" y="530" width="1220" height="66" rx="12" fill="#FCEBE5"/>
  <text x="57" y="554" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#6D382D">Separate boundary: NU-OPS-004 is approved but scheduled for Harbor Point only, 2024-10-07 through 2024-10-11. Routine checklist applies outside that</text>
  <text x="57" y="575" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#6D382D">window.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#18324B"/></marker></defs>
</svg>
