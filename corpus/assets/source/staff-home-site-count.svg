<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="562" viewBox="0 0 940 562" role="img" aria-labelledby="title desc">
  <title id="title">Staff registry entries by home site</title>
