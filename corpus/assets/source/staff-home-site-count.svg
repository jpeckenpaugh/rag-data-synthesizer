  <line x1="44" y1="466" x2="896" y2="466" stroke="#D7DFE2" stroke-width="2"/>
  <text x="44" y="499" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#18324B">Alder Creek: 0 registry entries (no staff.yml entry with home_site=alder_creek).</text>
  <text x="44" y="528" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#52636B">Counts are registry rows by home_site, not site staffing, coverage, or attendance.</text>
