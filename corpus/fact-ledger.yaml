      status: accepted
      decision_date: 2026-10-08
      decision: Ratified the issue, effective, review, working-record, supersession, precedence, and exception-window dates as fictional corpus history. NU-OPS-016 and NU-OPS-017 are superseded; NU-OPS-004 and NU-OPS-018 are approved and scheduled for their stated future effective dates.
      claim: Fictional timeline and precedence
      scope: >-
        Approved fictional issue/effective/review dates, September 2024 working-record events, the 2024-09-21 handoffs from NU-OPS-016 to NU-OPS-003 and NU-OPS-017 to NU-OPS-005, and the stated precedence and exception windows.
      decision_needed: None; the dates and transitions are established as fictional corpus history.
